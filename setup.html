<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Lock Setup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container large">
    <div class="text-center">
      <img src="icons/icon48.png" alt="Logo" class="icon-logo" id="logo-img">
      <h1>Welcome to Browser Lock</h1>
      <p id="subtitle">Protect your browsing session with a master password.</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>

    <div id="status-msg" class="message"></div>

    <!-- Step 1: Master Password -->
    <div id="step1">
      <div class="form-group">
        <label for="password">Create Master Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6">
      </div>
      <div class="form-group mb-4">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter password">
      </div>
      <button id="btn-next">Continue</button>
    </div>

    <!-- Step 2: Security Questions -->
    <div id="step2">
      <p class="mb-3 text-center">Set up 3 security questions to recover your password if forgotten. Answers must be at least 3 characters.</p>
      
      <div class="form-group">
        <label for="q1">Security Question 1</label>
        <select id="q1"></select>
        <input type="text" id="a1" placeholder="Your Answer" class="mt-1">
      </div>
      
      <div class="form-group">
        <label for="q2">Security Question 2</label>
        <select id="q2"></select>
        <input type="text" id="a2" placeholder="Your Answer" class="mt-1">
      </div>
      
      <div class="form-group mb-4">
        <label for="q3">Security Question 3</label>
        <select id="q3"></select>
        <input type="text" id="a3" placeholder="Your Answer" class="mt-1">
      </div>
      
      <button id="btn-finish">Complete Setup</button>
      <button id="btn-back" class="secondary mt-3">Back</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="setup.js"></script>
</body>
</html>
