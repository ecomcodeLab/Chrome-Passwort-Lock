<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Lock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: auto;
      align-items: flex-start;
      padding: 1rem;
      width: 280px;
    }
    .container {
      padding: 1.5rem;
      border: none;
      box-shadow: none;
      width: 100%;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-unlocked { background-color: var(--success); }
    .status-locked { background-color: var(--error); }
    .status-text {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }
    .version {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }
    .footer-link {
      text-align: center;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }
    .footer-link a {
      color: var(--primary);
      text-decoration: none;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
  <!-- Language dictionaries MUST load before i18n.js so t() never
       runs against an undefined I18N object (that crashed the page
       scripts and left every button dead). -->
  <script src="languages/en.js"></script>
  <script src="languages/de.js"></script>
  <script src="languages/es.js"></script>
  <script src="languages/fr.js"></script>
  <script src="languages/it.js"></script>
  <script src="languages/pt.js"></script>
  <script src="languages/ru.js"></script>
  <script src="languages/zh.js"></script>
  <script src="languages/ja.js"></script>
  <script src="languages/ko.js"></script>
  <script src="languages/hi.js"></script>
  <script src="languages/ar.js"></script>
  <script src="languages/tr.js"></script>
</head>
<body>
  <div class="container text-center">
    <img src="icons/icon48.png" alt="Logo" class="icon-logo">
    <h2 class="mb-2">Browser Lock</h2>

    <div class="status-text" id="status-container">
      <span class="status-indicator status-unlocked" id="status-dot"></span>
      <span id="status-label">Browser is unlocked</span>
    </div>

    <button type="button" id="btn-lock" class="danger mb-2">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      <span id="btn-lock-label" data-i18n="lockNow">Lock Now</span>
    </button>

    <button type="button" id="btn-settings" class="secondary mb-2">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span data-i18n="settings">Settings</span>
    </button>

    <div class="version">v1.3.0</div>
    <div class="footer-link">
      <span data-i18n="developedBy">Developed by</span> <a href="https://github.com/ecomcodeLab" target="_blank">ecomcodelab</a>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
