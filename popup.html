<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Lock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: auto;
      align-items: flex-start;
      padding: 1rem;
      width: 280px;
    }
    .container {
      padding: 1.5rem;
      border: none;
      box-shadow: none;
      width: 100%;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-unlocked { background-color: var(--success); }
    .status-locked { background-color: var(--error); }
    .status-text {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }
    .version {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }
    .footer-link {
      text-align: center;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }
    .footer-link a {
      color: var(--primary);
      text-decoration: none;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <img src="icons/icon48.png" alt="Logo" class="icon-logo">
    <h2 class="mb-2">Browser Lock</h2>
    
    <div class="status-text" id="status-container">
      <span class="status-indicator status-unlocked" id="status-dot"></span>
      <span id="status-label">Browser is unlocked</span>
    </div>

    <button id="btn-lock" class="danger mb-2">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      Lock Now
    </button>
    <button id="btn-settings" class="secondary">Settings</button>
    
    <div class="version">v1.0.0</div>
    <div class="footer-link">
      Developed by <a href="https://github.com/ecomcodeLab" target="_blank">ecomcodelab</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
