<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Locked</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Full screen lock overrides */
    body {
      background-color: rgba(11, 16, 32, 0.95);
      backdrop-filter: blur(10px);
    }
    .progress-text {
      text-align: center;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-center">
      <img src="icons/icon48.png" alt="Lock" class="icon-logo">
      <h1 id="main-title">Browser Locked</h1>
    </div>

    <div id="status-msg" class="message"></div>

    <!-- Login Section -->
    <div id="login-section">
      <div class="form-group mb-4">
        <input type="password" id="login-password" placeholder="Enter master password" autofocus>
      </div>
      <button id="btn-unlock" class="mb-3">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
        Unlock Browser
      </button>
      <div class="text-center">
        <span class="link" id="link-forgot">Forgot Password?</span>
      </div>
    </div>

    <!-- Recovery Questions Section -->
    <div id="recovery-section">
      <div class="progress-text" id="recovery-progress">Question 1 of 3</div>
      <div class="form-group mb-4">
        <label id="recovery-question-label">Loading question...</label>
        <input type="text" id="recovery-answer" placeholder="Your answer" autocomplete="off">
      </div>
      <button id="btn-recovery-next" class="mb-3">Next</button>
      <button id="btn-recovery-cancel" class="secondary">Cancel</button>
    </div>

    <!-- Reset Password Section -->
    <div id="reset-section">
      <p class="mb-3 text-center">Authentication successful. Create a new master password.</p>
      <div class="form-group">
        <input type="password" id="new-password" placeholder="New Password (min 6 chars)">
      </div>
      <div class="form-group mb-4">
        <input type="password" id="confirm-new-password" placeholder="Confirm New Password">
      </div>
      <button id="btn-reset-password">Reset & Unlock</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="lockscreen.js"></script>
</body>
</html>
